name: Publish release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish only after every build and installation test passes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cd release
          test -n "$(find . -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$(find . -maxdepth 1 -name '*.rpm' -print -quit)"
          test -n "$(find . -maxdepth 1 -name '*.pkg.tar.zst' -print -quit)"
          sha256sum ./*.deb ./*.rpm ./*.pkg.tar.zst ./*.tar.gz ./PKGBUILD > SHA256SUMS
          cat > release-notes.md <<'NOTES'
          Five native C/GTK3 applications: LimeCalc, LimeNotes, LimeTasks, LimeView and LimeClock.

          Downloads are for x86_64 Linux:
          - `.deb`: built on Ubuntu 22.04; installed and smoke-tested on Debian 12 and Ubuntu 24.04.
          - `.rpm`: built, installed and smoke-tested on Fedora 43.
          - `.pkg.tar.zst`: built, installed and smoke-tested on current Arch Linux; usable on Omarchy.
          - Source `.tar.gz` and a checksummed release `PKGBUILD` are included.

          Packages use system GTK3 libraries. No daemon or web runtime is installed.
          Removing a package preserves user data in the XDG data directory.
          Verify downloads with `sha256sum -c SHA256SUMS`.
          NOTES
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" ./*.deb ./*.rpm ./*.pkg.tar.zst ./*.tar.gz ./PKGBUILD ./SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" ./*.deb ./*.rpm ./*.pkg.tar.zst ./*.tar.gz ./PKGBUILD ./SHA256SUMS --repo "$GITHUB_REPOSITORY" --verify-tag --title "Lime Apps $RELEASE_TAG" --notes-file release-notes.md
          fi
